ticker: ADBE
name: Adobe — software mix / margin thesis
claims:
  - id: TC-01
    statement: "Revenue growth remains above 9% year over year"
    type: quantitative
    bindings:
      - tag: Revenues
        direction: increasing
        threshold: ">= 9% YoY"
    falsifiers:
      - "YoY revenue growth below 9% for two consecutive quarters"
