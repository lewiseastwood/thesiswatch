ticker: ADBE
name: Adobe — software mix / margin thesis
claims:
  - id: TC-01
    statement: "Revenue growth remains healthy year over year"
    type: quantitative
    bindings:
      - tag: Revenues
        direction: increasing
        # 9% alone sat ~370bp below the last print, so the claim read green
        # every quarter until it would have broken all at once. `watch` is where
        # the growth story starts changing; `falsified` is the old 9% bound.
        bands:
          watch: "11% YoY"
          falsified: "9% YoY"
    falsifiers:
      - "YoY revenue growth below the falsified band for two consecutive
        quarters"
    sections: [mda, financials]
  - id: TC-02
    statement: "Competitive pressure from generative AI entrants is not yet
      material to the risk profile"
    type: qualitative
    falsifiers:
      - "New or expanded risk factor naming AI competitors"
      - "Management attributes pricing pressure to AI substitutes"
    sections: [risk_factors, mda]
