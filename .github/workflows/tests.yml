name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      # No API key and no network. The gate tests are pure functions over string
      # fixtures; the dashboard tests render app.py through streamlit's AppTest
      # with THESES_DIR and RUNS_DIR pointed at temp dirs, using a thesis that
      # binds no XBRL metric, so nothing reaches EDGAR. Verified locally with
      # ANTHROPIC_API_KEY and SEC_UA_EMAIL unset.
      - name: pytest
        run: pytest -v

      # Both suites also run standalone, and their output states how many cases
      # ran ("33/33", "25/25"). That number is the point: pytest collected zero
      # tests from these files until the test_* wrappers were added, and a
      # runner that silently collects nothing still reports success. Keeping the
      # explicit totals in the log makes an empty run visible rather than green.
      - name: Case counts
        run: |
          python test_verify.py
          python test_dashboard.py
